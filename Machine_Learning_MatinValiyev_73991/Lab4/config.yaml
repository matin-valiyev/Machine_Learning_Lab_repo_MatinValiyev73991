pipeline_config:
  dataset:
    name: "adult"
    version: 2
    source: "fetch_openml"
  preprocessing:
    split:
      test_size: 0.30
      stratify: true
      random_state: 42
    numerical:
      imputation: "median"
      scaling: "StandardScaler"
      clipping_percentiles: [0.01, 0.99]
    categorical:
      imputation: "most_frequent"
      encoding: "OneHotEncoder"
  output:
    transformer_path: "results/preprocessor.joblib"
    dataset_hash_sha256: "c88faa037b22ef144728bf419ac720315df3a9b4385f4f290620ca55ada77b8f"